[package]
name = "healthbar"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
byteorder = "1.4.3"
iced-x86 = { version = "1.16.0", features = ["code_asm"]}
pvz = {path = "../pvz_model"}
toml = "0.5.8"
serde = { version = "1.0", features = ["derive"] }

[dependencies.windows]
version = "0.59"
features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_System_SystemServices",
]

[profile.release]
opt-level = 3
